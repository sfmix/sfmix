---
# Local TSDB on the SSD keeps the last month; history lives in the Thanos
# bucket on metrics01.scl04 (design doc 012). Size stays as a ceiling.
# Backfill of the pre-Thanos history verified complete 2026-11-10 (all 20
# blocks in the bucket, identical stats), so dropping local history is safe.
# Changing these restarts Prometheus (short scrape gap) -- bundle with other
# Prometheus restarts.
prometheus_retention_time: 30d
prometheus_retention_size: 60GB

prometheus_thanos_image: thanosio/thanos:v0.42.5
# Only for uploading blocks Prometheus compacted before the sidecar existed
# (one-time backfill, done). With 2h min/max blocks nothing compacts locally.
thanos_sidecar_upload_compacted: false
