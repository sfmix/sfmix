---
# Config and rule files reload live on SIGHUP — a full container restart
# (with its TSDB replay and metrics gap) is only needed when the container
# spec itself changes, and the docker_container task handles that itself.
# Named "Reload", not "Restart", to match what it actually does and to match
# the alertmanager/blackbox_exporter handlers: nothing here stops the process,
# so a config change never costs a TSDB replay or a gap in the graphs.
# HUP goes in via `docker exec ... kill -HUP 1`, never `docker kill --signal=HUP`:
# dockerd marks any container it signals as HasBeenManuallyStopped, so an
# unless-stopped container that was ever reloaded is skipped on the next boot.
- name: Reload prometheus
  ansible.builtin.command: docker exec prometheus sh -c 'kill -HUP 1'
