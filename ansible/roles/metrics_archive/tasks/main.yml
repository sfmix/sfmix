---
# Long-term metrics tier (design doc 012): Garage S3 holding the Thanos bucket
# plus thanos store + compact. Host-networked containers, reached only from
# metrics.sfo02 over the management network.

# ── Data disk ──────────────────────────────────────────────────────────
- name: "Archive: filesystem on the data disk"
  become: true
  community.general.filesystem:
    dev: "{{ metrics_archive_data_device }}"
    fstype: ext4
    opts: -L telemetry

- name: "Archive: mount the data disk"
  become: true
  ansible.posix.mount:
    path: "{{ metrics_archive_data_dir }}"
    src: LABEL=telemetry
    fstype: ext4
    opts: defaults,noatime
    state: mounted

- name: "Archive: data directories"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: u=rwx,g=rx,o=
  loop:
    - { path: "{{ metrics_archive_data_dir }}/garage", owner: 0 }
    - { path: "{{ metrics_archive_data_dir }}/garage/meta", owner: 0 }
    - { path: "{{ metrics_archive_data_dir }}/garage/data", owner: 0 }
    - { path: "{{ metrics_archive_data_dir }}/thanos-store", owner: 65534 }
    - { path: "{{ metrics_archive_data_dir }}/thanos-compact", owner: 65534 }
    - { path: /opt/garage, owner: 0 }

# ── Garage (S3) ────────────────────────────────────────────────────────
- name: "Garage: config"
  become: true
  ansible.builtin.template:
    src: garage.toml.j2
    dest: /opt/garage/garage.toml
    owner: root
    group: root
    mode: u=rw,go=
  notify: Restart garage

- name: "Garage: container"
  become: true
  community.docker.docker_container:
    name: garage
    image: "{{ metrics_archive_garage_image }}"
    restart_policy: unless-stopped
    network_mode: host
    # Thanos probes every block for optional marker files (deletion-mark.json,
    # no-compact-mark.json, no-downsample-mark.json) on every sync; absent is
    # normal, and Garage logs each 404 at info (~2k lines/h into Loki). The
    # API request logger at warn still logs 5xx.
    env:
      RUST_LOG: "netapp=info,garage=info,garage_api_common::generic_server=warn"
    volumes:
      - /opt/garage/garage.toml:/etc/garage.toml:ro
      - "{{ metrics_archive_data_dir }}/garage/meta:/var/lib/garage/meta"
      - "{{ metrics_archive_data_dir }}/garage/data:/var/lib/garage/data"

- name: "Garage: apply pending restarts before bootstrap"
  ansible.builtin.meta: flush_handlers

- name: "Garage: wait for RPC"
  ansible.builtin.wait_for:
    port: 3901
    timeout: 60

- name: "Garage: node id"
  become: true
  ansible.builtin.command: docker exec garage /garage node id -q
  register: garage_node_id
  changed_when: false

# Role defaults aren't visible through hostvars[other]; facts are.
- name: "Garage: publish this node's zone/capacity for the run-once steps"
  ansible.builtin.set_fact:
    garage_zone: "{{ metrics_archive_garage_zone }}"
    garage_capacity: "{{ metrics_archive_garage_capacity }}"

# Cluster-wide steps run once, from the first archive host, over every
# archive host in the play -- run this role for the whole metrics_archive
# group, not one host, or new nodes never join the layout.
- name: "Garage: connect peers"
  become: true
  ansible.builtin.command: docker exec garage /garage node connect {{ hostvars[item].garage_node_id.stdout }}
  loop: "{{ ansible_play_hosts | difference([inventory_hostname]) }}"
  run_once: true
  changed_when: false

- name: "Garage: layout"
  become: true
  ansible.builtin.command: docker exec garage /garage layout show
  register: garage_layout
  run_once: true
  changed_when: false

# Layout tables show the first 16 hex digits of a node id.
- name: "Garage: give nodes without a role their zone/capacity"
  become: true
  ansible.builtin.command: >-
    docker exec garage /garage layout assign
    -z {{ hostvars[item].garage_zone }}
    -c {{ hostvars[item].garage_capacity }}
    {{ hostvars[item].garage_node_id.stdout.split('@')[0] }}
  loop: "{{ ansible_play_hosts }}"
  when: hostvars[item].garage_node_id.stdout.split('@')[0][:16] not in garage_layout.stdout
  run_once: true
  register: garage_assigned

- name: "Garage: apply the staged layout"
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    v=$(docker exec garage /garage layout show | sed -n 's/.*Current cluster layout version: \([0-9]*\).*/\1/p')
    docker exec garage /garage layout apply --version $((v + 1))
  args:
    executable: /bin/bash
  when: garage_assigned is changed
  run_once: true

# The Thanos key is imported (not generated) so its secret lives in the vault.
- name: "Garage: is the Thanos key present"
  become: true
  ansible.builtin.command: docker exec garage /garage key info {{ thanos_s3_access_key }}
  register: garage_key
  run_once: true
  changed_when: false
  failed_when: false
  no_log: true

- name: "Garage: import the Thanos key"
  become: true
  ansible.builtin.command: >-
    docker exec garage /garage key import --yes -n thanos
    {{ thanos_s3_access_key }} {{ thanos_s3_secret_key }}
  when: garage_key.rc != 0
  run_once: true
  no_log: true

- name: "Garage: is the bucket present"
  become: true
  ansible.builtin.command: docker exec garage /garage bucket info {{ thanos_s3_bucket }}
  register: garage_bucket
  run_once: true
  changed_when: false
  failed_when: false

- name: "Garage: create the bucket"
  become: true
  ansible.builtin.command: docker exec garage /garage bucket create {{ thanos_s3_bucket }}
  when: garage_bucket.rc != 0
  run_once: true

- name: "Garage: grant the Thanos key on the bucket"
  become: true
  ansible.builtin.command: >-
    docker exec garage /garage bucket allow --read --write --owner
    {{ thanos_s3_bucket }} --key {{ thanos_s3_access_key }}
  when: garage_bucket.rc != 0 or garage_key.rc != 0
  run_once: true
  no_log: true

# ── Thanos store + compact ─────────────────────────────────────────────
# Only on telemetry_archive_host: a bucket must have exactly one compactor.
- name: "Thanos: store + compact"
  when: metrics_archive_thanos_enabled | bool
  block:
    - name: "Thanos: bucket config"
      ansible.builtin.include_role:
        name: thanos_objstore

    - name: "Thanos: store gateway"
      become: true
      community.docker.docker_container:
        name: thanos-store
        image: "{{ metrics_archive_thanos_image }}"
        restart_policy: unless-stopped
        network_mode: host
        user: "65534:65534"
        restart: "{{ thanos_objstore_config.changed }}"
        volumes:
          - /opt/thanos/objstore.yml:/etc/thanos/objstore.yml:ro
          - "{{ metrics_archive_data_dir }}/thanos-store:/data"
        command:
          - store
          - --data-dir=/data
          - --objstore.config-file=/etc/thanos/objstore.yml
          - --grpc-address=0.0.0.0:{{ thanos_store_grpc_port }}
          - --http-address=0.0.0.0:{{ metrics_archive_thanos_store_http_port }}

    # Compacts the sidecar's 2h blocks, downsamples to 5m (blocks > 40h) and 1h
    # (blocks > 10d), and applies per-resolution retention. Must be the only
    # compactor on the bucket.
    - name: "Thanos: compactor"
      become: true
      community.docker.docker_container:
        name: thanos-compact
        image: "{{ metrics_archive_thanos_image }}"
        restart_policy: unless-stopped
        network_mode: host
        user: "65534:65534"
        restart: "{{ thanos_objstore_config.changed }}"
        volumes:
          - /opt/thanos/objstore.yml:/etc/thanos/objstore.yml:ro
          - "{{ metrics_archive_data_dir }}/thanos-compact:/data"
        command:
          - compact
          - --wait
          - --wait-interval=5m
          - --data-dir=/data
          - --objstore.config-file=/etc/thanos/objstore.yml
          - --http-address=0.0.0.0:{{ metrics_archive_thanos_compact_http_port }}
          - --retention.resolution-raw={{ metrics_archive_thanos_retention_raw }}
          - --retention.resolution-5m={{ metrics_archive_thanos_retention_5m }}
          - --retention.resolution-1h={{ metrics_archive_thanos_retention_1h }}
          - --compact.concurrency=1
          - --downsample.concurrency=1
          - --delete-delay=48h

    # Bucket coverage per resolution -> node_exporter textfile (dashboard
    # "Long-term Metrics", where-the-data-is table).
    - name: "Thanos: script directory"
      become: true
      ansible.builtin.file:
        path: /usr/local/lib/sfmix
        state: directory
        owner: root
        group: root
        mode: u=rwx,go=rx

    - name: "Thanos: coverage exporter script"
      become: true
      ansible.builtin.copy:
        src: thanos_bucket_coverage.py
        dest: /usr/local/lib/sfmix/thanos_bucket_coverage.py
        owner: root
        group: root
        mode: u=rwx,go=rx

    - name: "Thanos: textfile directory"
      become: true
      ansible.builtin.file:
        path: "{{ metrics_archive_textfile_dir }}"
        state: directory
        owner: root
        group: root
        mode: u=rwx,go=rx

    - name: "Thanos: coverage exporter units"
      become: true
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: u=rw,go=r
      loop:
        - thanos-bucket-coverage.service
        - thanos-bucket-coverage.timer
      notify: Reload systemd

    - name: "Thanos: apply systemd unit changes"
      ansible.builtin.meta: flush_handlers

    - name: "Thanos: enable coverage timer"
      become: true
      ansible.builtin.systemd_service:
        name: thanos-bucket-coverage.timer
        enabled: true
        state: started
