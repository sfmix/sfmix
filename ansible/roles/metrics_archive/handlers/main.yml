---
- name: Restart garage
  ansible.builtin.command: docker restart garage

- name: Restart thanos-store
  ansible.builtin.command: docker restart thanos-store

- name: Restart thanos-compact
  ansible.builtin.command: docker restart thanos-compact

- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
