---
- name: Ensure bird_exporter directory
  become: true
  ansible.builtin.file:
    path: "{{ sfmix_route_server_linux_bird_exporter_directory }}"
    state: directory
    mode: gu=rwx,o=rx

- name: Clone bird_exporter repo
  become: true
  ansible.builtin.git:
    repo: "{{ sfmix_route_server_linux_bird_exporter_repo }}"
    dest: "{{ sfmix_route_server_linux_bird_exporter_directory }}/repo"
    version: "{{ sfmix_route_server_linux_bird_exporter_version }}"
    force: true
  notify: Rebuild bird_exporter docker container

- name: Trigger bird_exporter rebuilt and old container destruction
  ansible.builtin.meta: flush_handlers

- name: Run bird_exporter
  become: true
  community.docker.docker_container:
    name: bird_exporter
    image: "bird_exporter:{{ sfmix_route_server_linux_bird_exporter_version | replace('/', '_') }}"
    restart_policy: unless-stopped
    state: started
    network_mode: host
    log_driver: local
    # Mount the DIRECTORY, not the socket file. A file bind-mount pins the
    # inode at container start; every bird restart creates a new socket inode
    # on the host and the container keeps dialing the dead one ("connection
    # refused" on every scrape -- how the exporter was silently dead for months
    # in 2026). With the directory mounted, the path resolves to whatever
    # socket bird currently owns.
    volumes:
      - /run/bird:/var/run/bird
    command:
      -format.new=true
      -bird.v2
      -bird.socket=/var/run/bird/bird.ctl
      -web.listen-address={{ ansible_facts['default_ipv4']['address'] }}:{{ sfmix_route_server_linux_bird_exporter_port }}
