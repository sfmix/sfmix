---
- name: "Static directory for published artefacts"
  become: true
  ansible.builtin.file:
    path: "{{ looking_glass_web_static_directory }}"
    state: directory
    owner: sfmix
    group: sfmix
    mode: ug=rwx,o=rx

- name: "Summary page and its assets"
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ looking_glass_web_static_directory }}/"
    owner: sfmix
    group: sfmix
    mode: u=rw,go=r
    directory_mode: u=rwx,go=rx
  loop:
    - index.html
    - assets

# Guarded by a stat: the module regenerated the file on every run here
# (minutes of CPU each time), so only create it when it is missing.
- name: "Check for an existing dhparams file"
  ansible.builtin.stat:
    path: /etc/ssl/certs/dhparam.pem
  register: looking_glass_web_dhparam

- name: "Create a dhparams file"
  become: true
  community.crypto.openssl_dhparam:
    path: /etc/ssl/certs/dhparam.pem
    size: 2048
  when: not looking_glass_web_dhparam.stat.exists

- name: "Firewall: Allow HTTP(S)"
  become: true
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
  loop:
    - http
    - https
  when: sfmix_server_ufw_enabled | default(false) | bool

- name: "Install certbot (one lineage, all served names)"
  ansible.builtin.include_role:
    name: geerlingguy.certbot
    apply:
      become: true
  vars:
    certbot_admin_email: "{{ ixp_primary_tech_contact_email }}"
    certbot_create_if_missing: true
    certbot_create_standalone_stop_services: ["nginx.service"]
    certbot_certs:
      - domains: "{{ looking_glass_web_domains }}"

- name: "Install nginx (base config only)"
  ansible.builtin.include_role:
    name: geerlingguy.nginx
    apply:
      become: true
  vars:
    nginx_remove_default_vhost: true
    nginx_server_tokens: "off"
    nginx_extra_http_options: |
      ssl_session_cache shared:SSL:10m;
      ssl_session_timeout 1h;
      # An empty key is never counted, so exempt sources skip the zone.
      geo $lg_limit_exempt {
          default 0;
      {% for subnet in looking_glass_web_rate_limit_exempt_subnets %}
          {{ subnet }} 1;
      {% endfor %}
      }
      # Limits are per source prefix, /24 (IPv4) or /56 (IPv6), like lg-cli's
      # ip_to_rate_key, so one network can't dodge them by rotating
      # addresses. nginx can't mask addresses, so this parses the canonical
      # $remote_addr text (lowercase, no leading zeros, "::" may stand for any
      # run of zero groups, even one): groups 0-2 plus the top byte of group 3,
      # whose hex digits <t> captures ("" when zero). One line per position of
      # "::" within the first four groups. Unmatched forms (::1,
      # ::ffff:a.b.c.d) fall back to the single address.
      map $remote_addr $lg_source_prefix {
          default $remote_addr;
          "~^(?<p>\d+\.\d+\.\d+)\.\d+$" "net:$p";
          "~^(?<a>[0-9a-f]{1,4}):(?<b>[0-9a-f]{1,4}):(?<c>[0-9a-f]{1,4}):(?:[0-9a-f]{1,2}|(?<t>[0-9a-f]{1,2})[0-9a-f]{2})(?::|$)" "net:$a:$b:$c:$t";
          "~^(?<a>[0-9a-f]{1,4}):(?<b>[0-9a-f]{1,4}):(?<c>[0-9a-f]{1,4})::" "net:$a:$b:$c:";
          "~^(?<a>[0-9a-f]{1,4}):(?<b>[0-9a-f]{1,4})::(?:[0-9a-f]{1,2}|(?<t>[0-9a-f]{1,2})[0-9a-f]{2})(?::[0-9a-f]{1,4}){4}$" "net:$a:$b:0:$t";
          "~^(?<a>[0-9a-f]{1,4}):(?<b>[0-9a-f]{1,4})::" "net:$a:$b:0:";
          "~^(?<a>[0-9a-f]{1,4})::(?<c>[0-9a-f]{1,4}):(?:[0-9a-f]{1,2}|(?<t>[0-9a-f]{1,2})[0-9a-f]{2})(?::[0-9a-f]{1,4}){4}$" "net:$a:0:$c:$t";
          "~^(?<a>[0-9a-f]{1,4})::(?:[0-9a-f]{1,2}|(?<t>[0-9a-f]{1,2})[0-9a-f]{2})(?::[0-9a-f]{1,4}){4}$" "net:$a:0:0:$t";
          "~^(?<a>[0-9a-f]{1,4})::" "net:$a:0:0:";
      }
      map $lg_limit_exempt $lg_limit_key {
          0 $lg_source_prefix;
          1 "";
      }
      limit_req_zone $lg_limit_key zone=lg_ip:10m rate={{ looking_glass_web_rate_limit_rps }}r/s;
      # Concurrent requests per source (HTTP/2 streams count individually).
      limit_conn_zone $lg_limit_key zone=lg_conn:10m;
    nginx_vhosts: []

- name: "Template nginx vhosts config"
  become: true
  ansible.builtin.template:
    src: nginx-vhosts.conf.j2
    dest: /etc/nginx/conf.d/vhosts.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
