---
# Earlier versions of this role wrote these to /etc/sysctl.conf, and every reload of that file
# (including the next task's) re-applied forwarding=0 under a running dockerd. Drop them first,
# except where a host sets them itself (tailscale routes).
- name: Remove stale forwarding=0 sysctls
  become: true
  ansible.posix.sysctl:
    name: "{{ item }}"
    state: absent
    reload: false
  loop: "{{ ['net.ipv4.conf.all.forwarding', 'net.ipv4.conf.default.forwarding',
             'net.ipv6.conf.all.forwarding', 'net.ipv6.conf.default.forwarding']
           | difference(sfmix_server_sysctls | map(attribute='name')) }}"

- name: Set sysctl parameters
  become: true
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ sfmix_server_sysctls }}"

- name: Ignore IPv6 router advertisements
  ansible.builtin.import_tasks:
    file: ipv6_no_ra.yml
