---
- name: Detect OpenSSH server version
  become: true
  ansible.builtin.shell:
    cmd: "sshd -V 2>&1 | sed -n 's/.*OpenSSH_\\([0-9]*\\.[0-9]*\\).*/\\1/p' | head -1"
  register: _sshd_version
  changed_when: false

- name: Configure sshd MaxStartups
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^MaxStartups\s+'
    line: "MaxStartups 30:10:80"
    validate: sshd -t -f %s
  notify: Restart sshd

- name: Configure sshd PerSourceMaxStartups
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PerSourceMaxStartups\s+'
    line: "PerSourceMaxStartups 10"
    validate: sshd -t -f %s
  when: _sshd_version.stdout | length > 0 and _sshd_version.stdout is version('9.2', '>=')
  notify: Restart sshd

- name: Configure sshd PerSourcePenaltyExemptList
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PerSourcePenaltyExemptList\s+'
    line: "PerSourcePenaltyExemptList {{ ixp_admin_source_subnets | join(',') }}"
    validate: sshd -t -f %s
  when: _sshd_version.stdout | length > 0 and _sshd_version.stdout is version('9.8', '>=')
  notify: Restart sshd

- name: Configure sshd ListenAddress drop-in
  become: true
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-sfmix-listen.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (sfmix_server_sshd_listen_addresses)
      {% for addr in sfmix_server_sshd_listen_addresses %}
      ListenAddress {{ addr }}
      {% endfor %}
    validate: sshd -t -f %s
  when: sfmix_server_sshd_listen_addresses | length > 0
  notify:
    - Restart sshd
    - Restart ssh (Ubuntu 24+)

- name: Remove sshd ListenAddress drop-in
  become: true
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-sfmix-listen.conf
    state: absent
  when: sfmix_server_sshd_listen_addresses | length == 0
  notify:
    - Restart sshd
    - Restart ssh (Ubuntu 24+)
