---
# blackbox_exporter re-reads its config on SIGHUP; no need to bounce the
# container (and lose in-flight probes) for a config-only change.
# HUP goes in via `docker exec ... kill -HUP 1`, never `docker kill --signal=HUP`:
# dockerd marks any container it signals as HasBeenManuallyStopped, so an
# unless-stopped container that was ever reloaded is skipped on the next boot.
- name: Reload blackbox_exporter
  become: true
  ansible.builtin.command: docker exec blackbox_exporter sh -c 'kill -HUP 1'
  changed_when: true
