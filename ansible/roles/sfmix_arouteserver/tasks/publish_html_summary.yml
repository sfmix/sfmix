---
- name: "Publish HTML Sumary built by arouteserver for {{ item }}"
  become: true
  ansible.builtin.copy:
    src: "{{ arouteserver_var }}/{{ item }}.d/{{ item }}.summary.html"
    dest: "{{ sfmix_arouteserver_html_summary_directory | default('/var/www/htdocs') }}/{{ item }}.summary.html"
    owner: sfmix
    group: sfmix
    mode: ug=rw,o=r
  with_items: "{{ groups['route_servers'] }}"
