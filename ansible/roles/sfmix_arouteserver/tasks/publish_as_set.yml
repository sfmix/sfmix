---
- name: Publish as-set AS-SFMIX-RS to ARIN
  delegate_to: localhost
  run_once: true
  tags:
    - publish_as_set
  # Always run; in --check mode the script only prints the diff.
  check_mode: false
  ansible.builtin.command:
    argv: "{{ ['python3', playbook_dir ~ '/roles/sfmix_arouteserver/files/publish_as_set.py',
              arouteserver_var ~ '/' ~ inventory_hostname ~ '.d/' ~ inventory_hostname ~ '-irr-as-set.rpsl.txt']
             + (['--check'] if ansible_check_mode else []) }}"
  register: publish_as_set_result
  changed_when: publish_as_set_result.stdout_lines[-1] | default('') == 'CHANGED'
  environment:
    ARIN_API_KEY: "{{ arin_api_key }}"
    ARIN_ORG_HANDLE: "{{ arin_org_handle }}"
