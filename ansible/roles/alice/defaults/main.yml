---
alice_git_repo_version: "6.0.0"
alice_git_repo_url: "https://github.com/alice-lg/alice-lg.git"

alice_domain: alice.sfmix.org
# Per-IP request limiting for the Alice vhost (zone "alice_ip" is 5r/s, defined in
# the nginx http block). burst = how many requests above the rate a single
# client may have in flight before nginx answers 503.
alice_rate_limit_burst: 12
alice_rate_limit_delay: 8
alice_rate_limit_nodelay: false
# Sources exempt from the "ip" zone, same list as authentik's. The portal
# renders participant pages by calling lg-ng/alice server-side (~10 calls per
# page), so one scraper walking the portal pushed the portal's own address over
# 5r/s and every page it served for that minute failed with upstream 503s.
alice_rate_limit_exempt_subnets: >-
  {{ ixp_admin_source_subnets
     + (sfmix_host_local_admin_source_subnets | default([], true)) }}

# Paths crawlers are told to stay out of (served as /robots.txt by nginx).
alice_robots_disallow:
  - /search
  - /api/
  - /routeservers/
# Browser cache lifetime for theme and font assets (seconds). /static/ is
# content-hashed and always cached for a year.
alice_static_cache_max_age: 604800
alice_config_file: /opt/alice/alice.conf
alice_theme_directory: /opt/alice/theme
alice_theme_repo_url: https://github.com/alice-lg/alice-theme-example
alice_theme_repo_version: master

# Additional vhosts on this host (list of dicts with domain, upstream_port)
alice_additional_vhosts: []
# Example:
#   - domain: lg-ng.sfmix.org
#     upstream_port: 8080
