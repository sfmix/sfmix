---
# lg-web: the public looking-glass VM (design doc 009). Linux, sfo02,
# public leg on VLAN 101 (192.33.255.8 / 2620:11a:b000::8), mgmt leg
# 10.1.1.17. Runs lg-ng (group looking_glass_rust) behind the nginx front door
# of roles/looking_glass_web, which also fronts the OpenBSD route collector
# (mgmt.lg.sfmix.org) for the legacy bgplg/bgplgd paths.
sfmix_server_ufw_enabled: true

# Names served (one certbot lineage, named after the first).
looking_glass_web_domains:
  - lg-web.sfmix.org
  - lg.sfmix.org
  - lg-ng.sfmix.org
looking_glass_web_canonical_domain: lg.sfmix.org
looking_glass_web_redirect_domains:
  - lg-ng.sfmix.org

# participants*.json (website, sflow-rt, scripts) and the arouteserver
# rs-*.summary.html pages are published straight into the nginx static root.
# Literal (not the role default) because the publishing plays include other
# roles and looking_glass_web's defaults are not in scope there.
looking_glass_web_static_directory: /var/www/lg-web
participants_json_output_directory: /var/www/lg-web
sfmix_arouteserver_html_summary_directory: /var/www/lg-web
