---
# Public TLS endpoints probed by blackbox_exporter for certificate expiry.
#
# These are checked over the wire, from outside, exactly as a browser or a
# peer's automation would see them -- see roles/blackbox_exporter/defaults for
# why the on-disk cert is not a trustworthy signal.
#
# Add a name here whenever a new public HTTPS service goes live; the alert
# rules in roles/prometheus/templates/rules/tls.rules.yml.j2 pick it up with no
# further changes. Endpoints that are not publicly reachable (sentry, obscreen
# as of 2026-08-28) are intentionally absent. alertmanager/prometheus/sflow-rt
# .sfmix.org are authentik-proxied vhosts on login, not the metrics host itself.
# Kept here rather than only in the blackbox_exporter role defaults because the
# prometheus role's config template also needs it, and role defaults are
# role-scoped.
blackbox_exporter_listen_port: 9115

blackbox_tls_targets:
  - sfmix.org:443
  - www.sfmix.org:443
  - login.sfmix.org:443
  - portal.sfmix.org:443
  - lg.sfmix.org:443
  - grafana.sfmix.org:443
  - alertmanager.sfmix.org:443
  - prometheus.sfmix.org:443
  - sflow-rt.sfmix.org:443
  - netbox.sfmix.org:443
  - alice.sfmix.org:443
  - snappy.sfmix.org:443
  - teleport.sfmix.org:443
  - librenms.sfmix.org:443

# Targets to skip in the IPv6 probe job.
#
# snappy.sfmix.org publishes AAAA 2620:11a:b002::26 and answers TLS over v6 from
# outside, but TCP/443 and ICMP6 to it both time out from every SFMIX server
# (metrics.sfo02, portal, login, alice) as of 2026-08-28. That is a real
# reachability gap worth fixing, but it is not a certificate problem, and
# leaving it in the v6 job means TLSProbeFailing fires forever -- which trains
# everyone to ignore the TLS alerts. Excluded here deliberately: remove this
# entry the moment v6 to snappy is fixed, so the probe resumes covering it.
blackbox_tls_ipv6_exclude:
  - snappy.sfmix.org:443
  # librenms.sfmix.org publishes AAAA 2620:11a:b000::4 (CNAME -> monitor.sfo02)
  # but nginx there listens only on 0.0.0.0:80/443 -- there is no v6 socket, so
  # TCP/443 over v6 answers "Connection refused" immediately. This is NOT the
  # snappy case: ICMP6 and v6 routing to it are healthy from metrics.sfo02
  # (1.5ms, 0% loss) as of 2026-09-19. The real fix is one `listen [::]:443
  # ssl;` line in /etc/nginx/conf.d/librenms.conf on that host; drop this entry
  # the moment that lands so the v6 probe resumes covering it.
  - librenms.sfmix.org:443

# node_exporter scrape credential (plaintext); hosts carry only the bcrypt
# hash (roles/sfmix_server defaults sfmix_node_exporter_basic_auth_hash).
sfmix_node_exporter_basic_auth_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          65336135643431656162363665626334303530303830353361333635396366313663383930616635
          6161623738666264383735666431616161326635663138330a343261373764363337343465346334
          66343235336231646338306263323034636165643434383262633163323438636538323033373165
          3739343737383163620a376366376434633436636639383965663835313233303238356231356231
          63323939393430363764336666646564383035323432623037666661373735616332613262653862
          3832303636366465656636373735363331396164646531313835
