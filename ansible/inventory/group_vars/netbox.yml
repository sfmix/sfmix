---
netbox_stable: true
netbox_stable_version: 4.7.2
netbox_database_socket: "{{ postgresql_unix_socket_directories[0] }}"
netbox_database_conn_age: 300
netbox_superuser_enabled: true
netbox_superuser_username: admin
netbox_superuser_password: "{{ ixp_netbox_superuser_password }}"
netbox_socket: "127.0.0.1:8000"
netbox_config:
  ALLOWED_HOSTS:
    - "{{ ixp_netbox_domain }}"
    - 127.0.0.1
    - localhost
  MEDIA_ROOT: "{{ netbox_shared_path }}/media"
  REPORTS_ROOT: "{{ netbox_shared_path }}/reports"
  SCRIPTS_ROOT: "{{ netbox_shared_path }}/scripts"
  SENTRY_ENABLED: true
  # Service layer experiment (documentation/design_docs/009-netbox-services.md)
  PLUGINS:
    - netbox_services
  FIELD_CHOICES:
    netbox_services.Service.type+:
      - [peering_lan, Peering LAN]
      - [peering, Peering]
      - [private_vlan, Private VLAN]
  # NetBox 4.7 removed SENTRY_DSN; the DSN lives under SENTRY_CONFIG
  SENTRY_CONFIG:
    dsn: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      64656263656634326530653039316235626638613366663265303330373735383235343836356134
      6636313933623261653534323761336634393532636566610a653964653133656462363936666433
      35656362303038393164643438336466313163383335303462663430393630313064353665366233
      3635663866636135340a663135396264313035383634366463386434653336316530366137306132
      36396630313465613836636265323638353733353730633063323762623336373838656161663466
      36653237333365633764376434326564653738663132623734396565393564333637643065376264
      326164313036653635303431333264666661
netbox_database_user: netbox
netbox_metrics_enabled: true
postgresql_users:
  - name: "{{ netbox_database_user }}"
    role_attr_flags: CREATEDB,NOSUPERUSER
postgres_users_no_log: false
redis_bind: 127.0.0.1
redis_version: 6.0.9
redis_checksum: sha256:dc2bdcf81c620e9f09cfd12e85d3bc631c897b2db7a55218fd8a65eaa37f86dd
netbox_pip_packages:
  - sentry-sdk
  # sfmix fork branch (upstream v0.2.0 + our pending upstream PRs); bump the
  # pyproject +sfmix.N suffix with every new pin so pip reinstalls
  - git+https://github.com/sfmix/netbox-services@def2d8c323b99b2cd7363a1989b3a6fc7fa634b3#egg=netbox-services
# Override NetBox's exact pins ahead of an upstream release (Django/DRF
# 2026-10-06 security fixes). Keep the lae.netbox defaults; drop these once
# netbox_stable_version ships them.
netbox_pip_constraints:
  - 'pynacl!=1.3.0'
  - 'django-rq!=2.3.1'
  - 'Django==6.1.2'
  - 'djangorestframework==3.18.3'
# Ubuntu 24.04 (PEP 668) refuses system-wide pip installs
netbox_uwsgi_in_venv: true
netbox_uwsgi_options:
  buffer-size: 65535
  enable-threads: true
  max-requests: 5000
