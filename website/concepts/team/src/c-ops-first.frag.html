<style>
  .ops-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 0.5rem 2rem; margin-bottom: 1.25rem; }
  .ops-head h2 { margin-bottom: 0; }
  .ops-head p { margin: 0; max-width: 52ch; color: var(--color-text-light); }

  .ops-grid {
    display: grid; gap: 1rem;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "lead a b" "lead c reach";
  }
  .op { position: relative; display: flex; flex-direction: column; padding: 1.25rem; border-radius: 14px; background: var(--color-surface); border: 1px solid var(--color-border); }
  .op:target { box-shadow: 0 0 0 3px var(--ops); }
  .op .av { width: 72px; height: 72px; font-size: 1.3rem; margin-bottom: 0.85rem; }
  .op h3 { margin: 0; font-size: 1.1rem; color: var(--color-heading); }
  .op .t { font-weight: 600; color: var(--ops-ink); font-size: 0.925rem; }
  .op .ask { margin: 0.7rem 0 0.9rem; font-size: 0.925rem; }
  .op .ask b { display: block; font-weight: 600; font-size: 0.8rem; color: var(--color-text-light); }
  .op .foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .op .more { font-size: 0.875rem; font-weight: 600; color: var(--color-link); cursor: pointer; }
  .op .more:hover { text-decoration: underline; }

  /* Matt: the lead card. Big portrait band in the operations colour. */
  .op--lead { grid-area: lead; padding: 0; overflow: hidden; border: 0; background: var(--color-primary); color: #e9f2f4; }
  .op--lead .band { display: flex; align-items: flex-end; gap: 1.25rem; padding: 1.5rem 1.5rem 0; }
  .op--lead .av { width: 148px; height: 148px; border-radius: 12px; margin: 0; box-shadow: 0 0 0 4px var(--ops); }
  .op--lead h3 { color: #fff; font-size: 1.5rem; line-height: 1.2; }
  .op--lead .t { color: var(--ops); font-size: 1rem; }
  .op--lead .body { padding: 1.25rem 1.5rem 1.5rem; display: flex; flex-direction: column; flex: 1; }
  .op--lead .body p { margin: 0 0 0.9rem; max-width: 58ch; color: #cfe1e6; }
  .op--lead .ask b { color: #9fc2cb; }
  .op--lead .ask { color: #fff; }
  .op--lead .more { color: var(--ops); }
  .op--lead .chip { background: rgba(255,255,255,0.12); color: #fff; }
  .op--lead .chip--board { background: rgba(111,188,208,0.25); }
  .op--lead .xref { color: #cfe1e6; font-size: 0.875rem; }
  .op--lead .xref a { color: #fff; text-decoration: underline; }
  .op--lead.flash { animation: flash 900ms ease-out; }

  .reach { grid-area: reach; padding: 1.25rem; border-radius: 14px; background: var(--ops-wash); }
  .reach h3 { margin: 0 0 0.6rem; font-size: 1.05rem; color: var(--color-heading); }
  .reach p { margin: 0 0 0.5rem; font-size: 0.925rem; }
  .reach a { color: var(--color-link); font-weight: 600; }
  .reach .big { font-size: 1.05rem; }

  /* Board: a single strip of faces */
  .board { margin-top: 3.5rem; }
  .board > p { color: var(--color-text-light); max-width: 60ch; margin-bottom: 1.25rem; }
  .strip { list-style: none; padding: 0 !important; margin: 0 !important; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.75rem; }
  .strip li { margin: 0 !important; display: flex; flex-direction: column; align-items: center; }
  .strip button { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; padding: 0.75rem 0.4rem; border-radius: 12px; cursor: pointer; }
  .strip button:hover { background: var(--color-bg-alt); }
  .strip .av { width: 84px; height: 84px; margin-bottom: 0.55rem; }
  .strip .n { font-weight: 600; font-size: 0.925rem; color: var(--color-heading); line-height: 1.3; }
  .strip .t { font-size: 0.8rem; font-weight: 600; color: var(--board-ink); min-height: 1.25em; }
  .strip .a { font-size: 0.76rem; color: var(--color-text-light); line-height: 1.3; margin-top: 0.15rem; }
  .strip .also { display: inline-block; margin-top: -0.35rem; font-size: 0.72rem; font-weight: 600; color: var(--ops-ink); background: var(--ops-wash); padding: 0.05rem 0.5rem; border-radius: 999px; text-decoration: none; }
  .strip .also:hover { text-decoration: underline; }

  .thanks { margin-top: 3rem; display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
  .thanks h3 { font-size: 1rem; margin: 0 0 0.6rem; color: var(--color-heading); }
  .names { list-style: none; padding: 0 !important; margin: 0 !important; display: flex; flex-wrap: wrap; gap: 0.35rem 1.25rem; }
  .names li { margin: 0 !important; font-size: 0.95rem; }
  .names small { color: var(--color-text-light); }
  .names button { color: var(--color-link); cursor: pointer; }

  @keyframes flash { 0% { box-shadow: 0 0 0 6px var(--ops); } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .op--lead.flash { animation: none; } }

  @media (max-width: 980px) {
    .ops-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "lead lead" "a b" "c reach"; }
    .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    .ops-grid { grid-template-columns: 1fr; grid-template-areas: "lead" "reach" "a" "b" "c"; }
    .op--lead .band { flex-direction: column; align-items: flex-start; }
    .op--lead .av { width: 112px; height: 112px; }
    .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .thanks { grid-template-columns: 1fr; }
  }
</style>

<section class="ops">
  <div class="ops-head">
    <h2>The people you'll work with</h2>
    <p>Operations and technical advisory: who you'll hear from when you connect, change a port, or need a hand.</p>
  </div>
  <div class="ops-grid" id="ops"></div>
</section>

<section class="board">
  <h2>Board of directors</h2>
  <p>SFMIX is a member-governed cooperative. The board sets its direction.</p>
  <ul class="strip" id="board"></ul>
</section>

<section class="thanks">
  <div>
    <h3>Board alumni</h3>
    <ul class="names" id="alumni"></ul>
  </div>
  <div>
    <h3>Hackathon contributors</h3>
    <ul class="names" id="hack"></ul>
  </div>
</section>

<script>
(function () {
  var T = window.Team, esc = T.esc;
  var ops = T.byRole("ops");           // Matt first, by data order
  var lead = ops[0], others = ops.slice(1), areas = ["a", "b", "c"];

  function ask(p) { return p.focus ? '<p class="ask"><b>Talk to ' + esc((p.short || p.name).split(" ")[0]) + " about</b>" + esc(p.focus) + "</p>" : '<p class="ask muted">Bio coming soon.</p>'; }
  function moreBtn(p) { return T.hasBio(p) ? '<button type="button" class="reset more" data-bio="' + p.id + '">Read bio</button>' : ""; }

  var html =
    '<article class="op op--lead" id="ops-' + lead.id + '">' +
      '<div class="band">' + T.avatar(lead) + "<div><h3>" + esc(lead.name) + '</h3><div class="t">' + esc(T.titleFor(lead, "ops")) + "</div></div></div>" +
      '<div class="body">' +
        "<p>Matt founded SFMIX in 2006, the first non-profit Internet Exchange in San Francisco, and runs it as General Manager. He is a principal at Two P, an infrastructure consultancy, and has built network and data center teams at Tucows/Ting Fiber, Cumulus Networks, Tumblr and Square.</p>" +
        ask(lead) +
        '<div class="foot">' + T.chips(lead, { except: ["ops"], since: true }) + moreBtn(lead) + "</div>" +
        '<p class="xref" style="margin:0.75rem 0 0">Also listed with the <a href="#board-' + lead.id + '">board of directors</a>.</p>' +
      "</div></article>";

  html += others.map(function (p, i) {
    return '<article class="op" style="grid-area:' + areas[i] + '" id="ops-' + p.id + '">' + T.avatar(p) +
      "<h3>" + (p.url ? '<a href="' + p.url + '" style="color:inherit">' + esc(p.name) + "</a>" : esc(p.name)) + "</h3>" +
      '<div class="t">' + esc(T.titleFor(p, "ops")) + "</div>" + ask(p) +
      '<div class="foot">' + T.chips(p, { except: ["ops"], since: true }) + moreBtn(p) + "</div></article>";
  }).join("");

  html += '<aside class="reach"><h3>Reach operations</h3>' +
    '<p class="big"><a href="mailto:tech-c@sfmix.org">tech-c@sfmix.org</a></p>' +
    '<p><a href="tel:+14156346712">+1 415 634-6712</a></p>' +
    '<p>New to SFMIX? Start with the <a href="https://sfmix.org/connection-guide/">connection guide</a>. Participants can manage ports in the <a href="https://portal.sfmix.org/">portal</a>.</p></aside>';
  document.getElementById("ops").innerHTML = html;

  /* Board: officers first, then by surname. Matt is the same record as above. */
  var order = { President: 0, Treasurer: 1, Secretary: 2 };
  var board = T.byRole("board").slice().sort(function (a, b) {
    var ta = T.role(a, "board").title, tb = T.role(b, "board").title;
    var oa = ta in order ? order[ta] : 9, ob = tb in order ? order[tb] : 9;
    if (oa !== ob) return oa - ob;
    var sa = a.name.split(" ").pop(), sb = b.name.split(" ").pop();
    return sa.localeCompare(sb);
  });
  document.getElementById("board").innerHTML = board.map(function (p) {
    var r = T.role(p, "board");
    var title = r.title || (T.has(p, "ops") ? T.titleFor(p, "ops") : "");
    return '<li id="board-' + p.id + '"><button type="button" class="reset" data-bio="' + p.id + '">' + T.avatar(p) +
      '<span class="n">' + esc(p.name) + '</span><span class="t">' + esc(title) + '</span><span class="a">' + (p.affiliation || "") + "</span></button>" +
      (T.has(p, "ops") ? '<a class="also" href="#ops-' + p.id + '" data-flash="ops-' + p.id + '">Also in operations</a>' : "") +
      "</li>";
  }).join("");

  document.getElementById("alumni").innerHTML = T.byRole("alumni").map(function (p) {
    var note = T.has(p, "ops") ? ' <small>now in operations</small>' : "";
    return "<li>" + (T.hasBio(p) ? '<button type="button" class="reset" data-bio="' + p.id + '">' + esc(p.name) + "</button>" : esc(p.name)) + note + "</li>";
  }).join("");
  document.getElementById("hack").innerHTML = T.byRole("hackathon").map(function (p) { return "<li>" + esc(p.name) + "</li>"; }).join("");

  /* "Also in operations" jumps to the ops card instead of opening the bio. */
  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-flash]"); if (!a) return;
    e.stopPropagation();
    var card = document.getElementById(a.getAttribute("data-flash"));
    card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
  }, true);
})();
</script>
