name: Looking Glass Release

on:
  push:
    tags:
      - 'looking-glass-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: looking-glass
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#looking-glass-v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        # `stable` is a branch, not a release tag, so this pins the action's
        # code to its 2026-08-05 tip. That freezes the action, not the compiler:
        # `toolchain: stable` is resolved by rustup at run time, so releases keep
        # building with current stable. Stated explicitly because the implicit
        # default only exists in the `stable` branch's own action.yml.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: cargo build --workspace --release --target x86_64-unknown-linux-musl

      - name: Rename binaries
        run: |
          cd target/x86_64-unknown-linux-musl/release
          cp looking-glass ../../../looking-glass-linux-amd64
          cp lg-server ../../../lg-server-linux-amd64
          cp lg-cli ../../../lg-cli-linux-amd64
          cp lg-http ../../../lg-http-linux-amd64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "looking-glass v${{ steps.version.outputs.version }}"
          files: |
            looking-glass/looking-glass-linux-amd64
            looking-glass/lg-server-linux-amd64
            looking-glass/lg-cli-linux-amd64
            looking-glass/lg-http-linux-amd64
          generate_release_notes: true
